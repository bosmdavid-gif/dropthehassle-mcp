# Smithery stdio config: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      dthToken:
        type: string
        title: DropTheHassle token
        description: Optional. Account token from https://dropthehassle.com (menu, Connect your AI). It starts with dth_. Without it, deploy_site and search_domain work, and deploy_site returns a claim link.
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "dropthehassle-mcp@latest"],
      env: config.dthToken ? { DTH_TOKEN: config.dthToken } : {}
    })
  exampleConfig:
    dthToken: dth_your-token-here
